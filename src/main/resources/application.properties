spring.application.name=rp-system

# Conexão com o Banco de Dados
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/rp_system?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Sao_Paulo}
spring.datasource.username=${MYSQLUSER}
spring.datasource.password=${MYSQLPASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Desativação do DDL Automático do Hibernate (Crucial para o Flyway)
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=false

# Ativação e Configuração Estrita do Flyway
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# Interface (Thymeleaf para Desenvolvimento)
spring.thymeleaf.cache=false