<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RP System - Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        :root {
            --rp-bg-base: #0A0A0A;
            --rp-bg-surface: #141414;
            --rp-border: #2A2A2A;
            --rp-text-main: #F5F5F5;
            --rp-text-muted: #8A8A8A;
            --rp-accent: #FFFFFF;
            --rp-accent-invert: #000000;
        }

        body {
            background:
                radial-gradient(circle at 20% 20%, rgba(255, 255, 255, 0.06), transparent 30%),
                radial-gradient(circle at 80% 10%, rgba(255, 255, 255, 0.03), transparent 22%),
                linear-gradient(180deg, #0f0f0f 0%, #080808 100%);
            color: var(--rp-text-main);
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            overflow: hidden;
            position: relative;
            -webkit-font-smoothing: antialiased;
        }

        body::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.02), transparent 45%);
            z-index: 0;
            pointer-events: none;
        }

        .login-container {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 420px;
            padding: 16px;
        }

        .logo-wrapper {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 2rem; /* Aumentado o espaçamento para o card */
            animation: floatAnimation 4s ease-in-out infinite;
            filter: drop-shadow(0 15px 20px rgba(0, 0, 0, 0.6));
        }

        .logo-img {
            max-width: 160px;
            width: 100%;
            height: auto;
            object-fit: contain;
        }

        .login-card {
            background: rgba(20, 20, 20, 0.9);
            backdrop-filter: blur(14px) saturate(115%);
            -webkit-backdrop-filter: blur(14px) saturate(115%);
            border: 1px solid var(--rp-border);
            border-radius: 16px; /* Cantos suavizados (Moderna UI) */
            padding: 3rem 2.5rem 2rem 2.5rem;
            box-shadow: 0 24px 50px rgba(0, 0, 0, 0.7),
                        inset 0 1px 1px rgba(255, 255, 255, 0.04);
        }

        .brand-logo {
            font-size: 1.5rem;
            font-weight: 700;
            letter-spacing: 6px;
            color: var(--rp-text-main);
            text-transform: uppercase;
            text-align: center;
            margin-bottom: 0.3rem;
        }

        .brand-sub {
            font-size: 0.7rem;
            color: var(--rp-text-muted);
            text-align: center;
            letter-spacing: 3px;
            text-transform: uppercase;
            margin-bottom: 2.5rem;
            opacity: 0.9;
        }

        .form-label {
            color: var(--rp-text-muted);
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            font-weight: 600;
            margin-bottom: 0.5rem;
        }

        .form-control {
            background: var(--rp-bg-base);
            border: 1px solid var(--rp-border);
            color: var(--rp-text-main);
            border-radius: 8px;
            padding: 0.85rem 1.1rem;
            font-size: 0.95rem;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .form-control:focus {
            background: var(--rp-bg-base);
            border-color: var(--rp-text-muted);
            color: var(--rp-text-main);
            box-shadow: none;
        }

        .form-control::placeholder {
            color: rgba(138, 138, 138, 0.45);
        }

        .btn-raro {
            background: var(--rp-accent);
            color: var(--rp-accent-invert);
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 3px;
            border: none;
            border-radius: 8px;
            padding: 0.9rem;
            width: 100%;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            margin-top: 1.5rem;
            box-shadow: 0 4px 15px rgba(255, 255, 255, 0.12);
        }

        .btn-raro:hover {
            background: #e0e0e0;
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(255, 255, 255, 0.18);
        }

        .btn-raro:active {
            transform: translateY(0);
        }

        .system-footer {
            margin-top: 2rem;
            font-size: 0.65rem;
            color: var(--rp-text-muted);
            text-align: center;
            letter-spacing: 2px;
            opacity: 0.5;
            text-transform: uppercase;
        }

        /* Regras de Animação Pura (GPU Accelerated) */
        @keyframes floatAnimation {
            0% {
                transform: translateY(0px);
            }
            50% {
                transform: translateY(-16px); /* Amplitude de flutuação ligeiramente maior */
            }
            100% {
                transform: translateY(0px);
            }
        }
    </style>
</head>
<body>

<div class="login-container">

    <div class="logo-wrapper">
        <img th:src="@{/images/logo.png}" alt="Raro Porte Logo" class="logo-img">
    </div>

    <div class="login-card">
        <div class="brand-logo">Raro Porte</div>
        <div class="brand-sub">RP System v0.0.1</div>

        <div class="alert alert-danger py-2 px-3 mb-3 d-none" id="loginErrorBox" role="alert">
            Usuário ou senha inválidos.
        </div>

        <div class="alert alert-success py-2 px-3 mb-3 d-none" id="logoutBox" role="alert">
            Sessão encerrada com sucesso.
        </div>

        <form th:action="@{/login}" method="POST">
            <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <div class="mb-3">
                <label for="username" class="form-label">Sócio / Usuário</label>
                <input type="text" id="username" name="username" class="form-control" placeholder="ex: josue.lisboa" required autocomplete="off">
            </div>

            <div class="mb-4">
                <label for="password" class="form-label">Chave de Acesso</label>
                <input type="password" id="password" name="password" class="form-control" placeholder="••••••••" required>
            </div>

            <button type="submit" class="btn-raro">Autenticar</button>
        </form>

        <div class="system-footer">
            PROPEDÊUTICA DE GOVERNANÇA INTEGRADA
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
    const params = new URLSearchParams(window.location.search);
    const errorBox = document.getElementById('loginErrorBox');
    const logoutBox = document.getElementById('logoutBox');

    if (params.has('error')) {
        errorBox.classList.remove('d-none');
    }

    if (params.has('logout')) {
        logoutBox.classList.remove('d-none');
    }
</script>
</body>
</html>
